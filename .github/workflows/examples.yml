name: User environment and model checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.12'
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --extra cpu
      - run: uv run --locked --extra cpu python -m example.environment.verify --backend cpu
      - run: uv run --locked --extra cpu python -m example.models.forward --all --backward
